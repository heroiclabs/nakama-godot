version: '3'

tasks:
  run-server:
    cmds:
      - docker compose -f test_suite/docker-compose.yml up -d --build --wait nakama

  stop-server:
    cmds:
      - docker compose -f test_suite/docker-compose.yml down

  test-nakama:
    cmds:
      # Only the Nakama addon, so the tests catch any dependency on Satori.
      - rm -rf test_suite/nakama_tests/addons && mkdir -p test_suite/nakama_tests/addons && cp -R addons/com.heroiclabs.nakama test_suite/nakama_tests/addons/
      - |
        godot="${GODOT:-/Applications/Godot.app/Contents/MacOS/Godot}"
        # --import first registers the addon's class_names, which a plain run does not.
        "$godot" --headless --path test_suite/nakama_tests --import > /dev/null 2>&1
        status=0
        out=$("$godot" --headless --path test_suite/nakama_tests --script res://runner.gd 2>&1) || status=$?
        echo "$out"
        # Godot exits 0 on script errors, so judge by the runner's output as well as the exit status.
        echo "$out" | grep -q "======= TESTS END" || { echo "Run failed!"; exit 1; }
        if echo "$out" | grep -q "FAILURE\|SCRIPT ERROR"; then echo "Tests failed!"; exit 1; fi
        [ "$status" -eq 0 ] || { echo "Godot exited with status $status"; exit 1; }
        echo "Tests passed!"

  test-satori:
    cmds:
      # Only the Satori addon, so the tests catch any dependency on Nakama.
      - rm -rf test_suite/satori_tests/addons && mkdir -p test_suite/satori_tests/addons && cp -R addons/com.heroiclabs.satori test_suite/satori_tests/addons/
      - |
        godot="${GODOT:-/Applications/Godot.app/Contents/MacOS/Godot}"
        "$godot" --headless --path test_suite/satori_tests --import > /dev/null 2>&1
        status=0
        out=$("$godot" --headless --path test_suite/satori_tests --script res://runner.gd 2>&1) || status=$?
        echo "$out"
        # Godot exits 0 on script errors, so judge by the runner's output as well as the exit status.
        echo "$out" | grep -q "======= TESTS END" || { echo "Run failed!"; exit 1; }
        if echo "$out" | grep -q "FAILURE\|SCRIPT ERROR"; then echo "Tests failed!"; exit 1; fi
        [ "$status" -eq 0 ] || { echo "Godot exited with status $status"; exit 1; }
        echo "Tests passed!"

  # Parses every Satori script without a Satori server, for CI, which has none.
  check-satori:
    cmds:
      - rm -rf test_suite/satori_tests/addons && mkdir -p test_suite/satori_tests/addons && cp -R addons/com.heroiclabs.satori test_suite/satori_tests/addons/
      - |
        godot="${GODOT:-/Applications/Godot.app/Contents/MacOS/Godot}"
        "$godot" --headless --path test_suite/satori_tests --import > /dev/null 2>&1
        out=""
        failed=""
        for f in test_suite/satori_tests/addons/com.heroiclabs.satori/*.gd; do
          status=0
          fout=$("$godot" --headless --path test_suite/satori_tests --check-only --script "res://${f#test_suite/satori_tests/}" 2>&1) || status=$?
          out="$out$fout"
          [ "$status" -eq 0 ] || { echo "$fout"; failed="$failed $f (status $status)"; }
        done
        # --check-only exits 0 on parse errors, so judge by the output as well as the exit status.
        if echo "$out" | grep -q "SCRIPT ERROR"; then echo "$out" | grep -A2 "SCRIPT ERROR"; echo "Satori scripts do not parse!"; exit 1; fi
        [ -z "$failed" ] || { echo "Godot did not complete for:$failed"; exit 1; }
        echo "Satori scripts parse."

  test-dotnet:
    cmds:
      - |
        godot="${GODOT_MONO:-/Applications/Godot_mono.app/Contents/MacOS/Godot}"
        # Import first: it sets the csproj's Godot.NET.Sdk to this Godot's version, so the build below matches it.
        # The .NET import now and then aborts (exit 134), so try once more, this time showing its output.
        "$godot" --headless --path test_suite/dotnet_tests --import > /dev/null 2>&1 \
            || "$godot" --headless --path test_suite/dotnet_tests --import \
            || { echo "Import failed!"; exit 1; }
        dotnet build test_suite/dotnet_tests -nologo -v q || { echo "Build failed!"; exit 1; }
        # The Satori scene skips itself unless SATORI_HOST and SATORI_API_KEY are set.
        for scene in res://nakama_adapter_test.tscn res://satori_adapter_test.tscn; do
          status=0
          out=$("$godot" --headless --path test_suite/dotnet_tests "$scene" 2>&1) || status=$?
          echo "$out"
          # Godot exits 0 on script errors, so judge by the scene's output as well as the exit status.
          echo "$out" | grep -q "======= TESTS END" || { echo "Run failed!"; exit 1; }
          if echo "$out" | grep -q "FAILURE\|SCRIPT ERROR"; then echo "Tests failed!"; exit 1; fi
          [ "$status" -eq 0 ] || { echo "Godot exited with status $status"; exit 1; }
        done
        echo "Tests passed!"

  release:
    requires:
      vars: [VERSION]
    cmds:
      - rm -f nakama-{{.VERSION}}.zip
      - zip -r nakama-{{.VERSION}}.zip addons/ LICENSE CHANGELOG.md README.md -x "*.DS_Store"
